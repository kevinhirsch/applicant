<style>
  /* Applicant nav: span full sidebar width, stack vertically, own scroll. */
  #applicant-hello-world-nav {
    display: flex;
    flex-direction: column;
    grid-column: 1 / -1;      /* was crammed into 1 of 5 grid columns */
    gap: 2px;
    max-height: 45vh;         /* bug 3: bound height so it can't be clipped */
    overflow-y: auto;         /* ...and expose its own scrollbar instead */
  }
  /* Unified item-row style — shared with the Chats/Tasks list rows
     (see left-sidebar.html / chats-list.html / tasks-list.html) so the
     whole sidebar reads as one design system. */
  #applicant-hello-world-nav .sidebar-action {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 7px 16px;
    background: transparent; border: none; border-radius: 6px;
    color: var(--color-text); font-family: var(--font-family-main);
    font-size: 13px; font-weight: 400; text-align: left; opacity: .85;
    cursor: pointer; transition: background-color .15s ease; white-space: nowrap;
  }
  #applicant-hello-world-nav .sidebar-action:hover {
    background-color: var(--color-background-hover); opacity: 1;
  }
  #applicant-hello-world-nav .sidebar-action .material-symbols-outlined {
    font-size: 19px; color: inherit;
  }
  /* The brand wordmark above already identifies this section, so this
     duplicate "Applicant" group label is hidden. Kept in the DOM (not
     deleted) so the pinned nav test's element contract is untouched. */
  #applicant-hello-world-nav .sidebar-group-label {
    display: none;
  }
</style>

<style>
/* Unified sidebar visual system (Applicant) — one style for headers, rows, placeholder.
   FIX (APP-LP-1 contrast pass): the row/icon colors below were hardcoded to
   near-white rgba(255,255,255,*) — readable only against the base app's
   permanently-dark chrome assumption. This sidebar's OWN background
   (#left-panel) already adapts via --color-panel/.light-mode (see
   left-sidebar.html), so a hardcoded white foreground went invisible
   (white-on-near-white) the moment a user picked light mode. Swapped for the
   same adaptive --color-text token the row rule just above this block
   already uses correctly, so light and dark both stay legible. */
#left-panel .section-header, #left-panel h3 { text-transform:uppercase!important; font-size:11px!important; font-weight:600!important; letter-spacing:.5px!important; color:var(--color-text-secondary,#737a81)!important; padding:14px 16px 6px!important; margin:0!important; text-align:left!important; font-style:normal!important; }
#left-panel .sidebar-action, #left-panel .chat-container, #left-panel .task-container { display:flex!important; align-items:center!important; gap:10px!important; padding:6px 16px!important; font-size:13px!important; font-weight:400!important; color:var(--color-text)!important; text-align:left!important; }
#left-panel .sidebar-action .material-symbols-outlined, #left-panel .chat-container .material-symbols-outlined, #left-panel .task-container .material-symbols-outlined { font-size:19px!important; color:color-mix(in srgb, var(--color-text) 72%, transparent)!important; }
.empty-list-message, [class*="empty-list"] { text-align:left!important; font-style:normal!important; font-size:12px!important; color:var(--color-text-secondary,#737a81)!important; padding:8px 16px!important; justify-content:flex-start!important; }
</style>
