<link rel="stylesheet" href="/plugins/applicant/webui/applicant-theme.css">
<!-- EPIC MODEL-CONFIG — per-use-case model/endpoint configuration surface.
     Every LLM use case is bound to the shared tier ladder ("Default") OR to any saved
     OpenAI-compatible endpoint (base_url+key+model). REUSES the engine's
     ModelEndpointService registry + tier ladder via the model_config proxy
     (action=get_use_cases|set_use_case|clear_use_case|get_smart_routing|
     set_smart_routing|from_endpoint). Defaults are preset but overridable; fresh
     install works with zero config (everything resolves to the ladder). -->
<style>
  .amcfg{max-width:820px;margin:0 auto;padding:8px 4px;color:var(--color-text);font-family:inherit}
  .amcfg h1{font-size:1.5rem;margin:0 0 .25rem}
  .amcfg h2{font-size:1.1rem;margin:1.25rem 0 .5rem}
  .amcfg .sub{color:var(--color-text-secondary,#6b7683);margin:0 0 1rem;font-size:.95rem}
  .amcfg .err{background:var(--color-danger-bg,#fdecea);color:var(--color-danger-text,#9b1c1c);border-radius:8px;padding:8px 12px;font-size:.85rem;margin-top:.75rem}
  .amcfg .ok{color:var(--color-success-text,#1a7d1a);font-size:.82rem;padding:4px 0}
  .amcfg .btn{padding:6px 12px;border-radius:8px;border:1px solid var(--color-border,#d8e0e6);background:var(--color-panel,#f2f5f7);color:var(--color-text);font:inherit;font-weight:600;cursor:pointer;font-size:.8rem}
  .amcfg .btn.primary{background:var(--color-primary,#2d7ff9);color:#fff;border-color:var(--color-primary,#2d7ff9)}
  .amcfg .btn:disabled{opacity:.5;cursor:not-allowed}
  .amcfg .loading{text-align:center;padding:30px;color:var(--color-text-secondary,#6b7683)}
  .amcfg .spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--color-border,#d8e0e6);border-top-color:var(--color-primary,#2d7ff9);border-radius:50%;animation:amcfg-spin .6s linear infinite}
  @keyframes amcfg-spin{to{transform:rotate(360deg)}}
  .amcfg .card{border:1px solid var(--color-border,#d8e0e6);border-radius:10px;background:var(--color-panel,#f2f5f7);padding:12px 14px;margin-bottom:12px}
  .amcfg .inst{color:var(--color-text-secondary,#6b7683);font-size:.82rem;margin-bottom:.75rem;padding:8px 12px;background:var(--color-panel,#f2f5f7);border-radius:8px;border:1px solid var(--color-border,#d8e0e6)}
  .amcfg .grp{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--color-text-secondary,#6b7683);margin:1rem 0 .35rem;font-weight:700}
  .amcfg .uc{background:var(--color-background,#fff);border:1px solid var(--color-border,#d8e0e6);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .amcfg .uc .name{font-weight:600;font-size:.9rem}
  .amcfg .uc .desc{font-size:.76rem;color:var(--color-text-secondary,#6b7683);margin-top:2px}
  .amcfg .uc .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .amcfg select,.amcfg input{padding:6px 8px;border-radius:6px;border:1px solid var(--color-border,#d8e0e6);background:var(--color-background,#fff);color:var(--color-text);font:inherit;font-size:.82rem}
  .amcfg select{min-width:180px}
  .amcfg input.model{min-width:200px;flex:1}
  .amcfg .badge{font-size:.7rem;padding:2px 7px;border-radius:10px;background:var(--color-panel,#e9edf1);display:inline-block;margin-left:6px}
  .amcfg .badge.warn{background:var(--color-danger-bg,#fdecea);color:var(--color-danger-text,#9b1c1c)}
  .amcfg .toggle{display:flex;gap:10px;align-items:center;font-size:.85rem;margin:4px 0}
  .amcfg .status{font-size:.8rem;color:var(--color-text-secondary,#6b7683);margin-top:6px}
</style>

<div class="amcfg" x-data="modelConfigPanel()">
  <h1>Model Configuration <button class="help-btn" onclick="window.openModal('/plugins/applicant/webui/help.html?surface=model_config')" title="Help">?</button></h1>
  <p class="sub">Bind each use case to a local model or any OpenAI-compatible endpoint. Defaults are preset and always overridable; unbound use cases follow the tier ladder.</p>

  <div class="loading" x-show="loading"><div class="spinner"></div><br>Loading model configuration…</div>
  <div class="err" x-show="fatalError" x-text="fatalError"></div>

  <template x-if="!loading && !fatalError">
    <div>
      <!-- Smart-routing master flag (deferred item: llm_smart_routing UI) -->
      <div class="card">
        <h2 style="margin-top:0">Smart routing</h2>
        <div class="inst" style="margin-bottom:.5rem">
          The router picks the best online endpoint per task and reorders the ladder live.
          The ladder is never forked — every tier stays as a fallback.
        </div>
        <label class="toggle">
          <input type="checkbox" x-model="smart.enabled" @change="saveSmartRouting()">
          <span>Enable smart routing (master switch)</span>
        </label>
        <label class="toggle">
          <input type="checkbox" x-model="smart.prefer_local" @change="saveSmartRouting()" :disabled="!smart.enabled">
          <span>Prefer a local model when one is online</span>
        </label>
        <div class="status" x-show="routing">
          <template x-if="routing && routing.enabled">
            <span>
              Serving from
              <strong x-text="routing.active_endpoint ? (routing.active_endpoint.name || routing.active_endpoint.base_url) : 'no endpoint selected'"></strong>
              <span x-show="routing.reordered"> — ladder reordered live</span>
            </span>
          </template>
          <span x-show="routing && !routing.enabled">Smart routing is off — the ladder runs in its configured order.</span>
        </div>
        <div class="ok" x-show="smartMsg" x-text="smartMsg"></div>
      </div>

      <!-- Quick-set the default model from a saved endpoint (deferred item:
           POST /api/setup/llm/from-endpoint UI). -->
      <div class="card">
        <h2 style="margin-top:0">Default model (Tier 1)</h2>
        <div class="inst" style="margin-bottom:.5rem">
          Set the primary model everything falls back to, straight from a saved endpoint.
        </div>
        <div class="uc" style="margin:0">
          <div class="row">
            <select x-model="fromEp.endpoint_id" @change="fromEp.model=''">
              <option value="">Choose an endpoint…</option>
              <template x-for="ep in endpoints" :key="ep.id">
                <option :value="ep.id" x-text="(ep.name || ep.base_url) + (ep.online ? '' : ' (offline)')"></option>
              </template>
            </select>
            <template x-if="fromEpModels().length">
              <select x-model="fromEp.model">
                <option value="">Choose a model…</option>
                <template x-for="m in fromEpModels()" :key="m"><option :value="m" x-text="m"></option></template>
              </select>
            </template>
            <input class="model" type="text" x-model="fromEp.model" placeholder="…or type a model name">
            <button class="btn primary" @click="applyFromEndpoint()" :disabled="busy || !fromEp.endpoint_id || !fromEp.model.trim()">Set as default</button>
          </div>
          <div class="ok" x-show="fromEpMsg" x-text="fromEpMsg"></div>
        </div>
      </div>

      <!-- Per-use-case bindings -->
      <h2>Per-use-case model / endpoint</h2>
      <div class="inst">
        "Default" walks the tier ladder above. Pick an endpoint to pin a specific model
        for that use case; the ladder stays below it as the configured fallback.
      </div>
      <template x-for="group in groups" :key="group">
        <div>
          <div class="grp" x-text="group"></div>
          <template x-for="uc in useCasesIn(group)" :key="uc.key">
            <div class="uc">
              <div class="name">
                <span x-text="uc.label"></span>
                <span class="badge" x-show="uc.mode==='default'" x-text="uc.preset_model ? ('preset: ' + uc.preset_model) : ('preset: ' + uc.preset_target)"></span>
                <span class="badge warn" x-show="uc.mode==='endpoint' && uc.endpoint_missing">endpoint missing</span>
              </div>
              <div class="desc" x-text="uc.description"></div>
              <div class="row">
                <select x-model="uc.endpoint_id" @change="onEndpointChange(uc)">
                  <option value="">Default (tier ladder)</option>
                  <template x-for="ep in endpoints" :key="ep.id">
                    <option :value="ep.id" x-text="(ep.name || ep.base_url) + (ep.online ? '' : ' (offline)')"></option>
                  </template>
                </select>
                <template x-if="uc.endpoint_id && modelsFor(uc.endpoint_id).length">
                  <select x-model="uc.model">
                    <option value="">Choose a model…</option>
                    <template x-for="m in modelsFor(uc.endpoint_id)" :key="m"><option :value="m" x-text="m"></option></template>
                  </select>
                </template>
                <input class="model" type="text" x-model="uc.model" x-show="uc.endpoint_id" placeholder="Model name (e.g. deepseek-v4-flash)">
                <button class="btn primary" @click="saveUseCase(uc)" :disabled="busy || (uc.endpoint_id && !uc.model.trim())">Save</button>
                <button class="btn" @click="clearUseCase(uc)" :disabled="busy || uc.mode==='default'">Reset</button>
              </div>
              <div class="ok" x-show="uc._msg" x-text="uc._msg"></div>
            </div>
          </template>
        </div>
      </template>
    </div>
  </template>
</div>

<script>
  (() => {
  const _apiP = import("/js/api.js");
  const callJsonApi = async (ep, ...a) => (await _apiP).callJsonApi((ep && String(ep).startsWith("plugins/")) ? ep : ("plugins/applicant/" + ep), ...a);

  window.Alpine.data("modelConfigPanel", () => ({
    loading: true,
    busy: false,
    fatalError: "",
    useCases: [],
    endpoints: [],
    groups: [],
    smart: { enabled: false, prefer_local: true },
    routing: null,
    smartMsg: "",
    fromEp: { endpoint_id: "", model: "" },
    fromEpMsg: "",

    async init() {
      await this.load();
    },

    async load() {
      this.loading = true;
      this.fatalError = "";
      const r = await callJsonApi("model_config", { action: "get_use_cases" });
      if (!r || !r.ok) {
        this.fatalError = (r && r.error) || "Couldn't reach the model-config engine.";
        this.loading = false;
        return;
      }
      const d = r.data || {};
      // Each row keeps its own model dropdown state + a per-row save message.
      this.useCases = (d.use_cases || []).map(uc => ({ ...uc, _msg: "" }));
      this.endpoints = d.endpoints || [];
      this.groups = [...new Set(this.useCases.map(u => u.group))];
      if (d.smart_routing) {
        this.smart = { enabled: !!d.smart_routing.enabled, prefer_local: !!d.smart_routing.prefer_local };
      }
      this.routing = d.routing || null;
      this.loading = false;
    },

    useCasesIn(group) { return this.useCases.filter(u => u.group === group); },

    modelsFor(endpointId) {
      const ep = this.endpoints.find(e => e.id === endpointId);
      return (ep && ep.models) || [];
    },

    fromEpModels() { return this.modelsFor(this.fromEp.endpoint_id); },

    onEndpointChange(uc) {
      // Switching to "Default" clears the pinned model.
      if (!uc.endpoint_id) uc.model = "";
    },

    async saveUseCase(uc) {
      this.busy = true; uc._msg = "";
      const mode = uc.endpoint_id ? "endpoint" : "default";
      const r = await callJsonApi("model_config", {
        action: "set_use_case",
        use_case: uc.key,
        mode,
        endpoint_id: uc.endpoint_id || "",
        model: uc.model || "",
      });
      if (!r || !r.ok) {
        uc._msg = (r && r.error) || "Failed to save.";
      } else {
        uc._msg = "Saved.";
        await this.load();
      }
      this.busy = false;
    },

    async clearUseCase(uc) {
      this.busy = true; uc._msg = "";
      const r = await callJsonApi("model_config", { action: "clear_use_case", use_case: uc.key });
      if (!r || !r.ok) {
        uc._msg = (r && r.error) || "Failed to reset.";
      } else {
        await this.load();
      }
      this.busy = false;
    },

    async saveSmartRouting() {
      this.busy = true; this.smartMsg = "";
      const r = await callJsonApi("model_config", {
        action: "set_smart_routing",
        enabled: this.smart.enabled,
        prefer_local: this.smart.prefer_local,
      });
      if (!r || !r.ok) {
        this.smartMsg = (r && r.error) || "Failed to save smart-routing setting.";
      } else {
        this.smartMsg = "Saved.";
        await this.load();
      }
      this.busy = false;
    },

    async applyFromEndpoint() {
      if (!this.fromEp.endpoint_id || !this.fromEp.model.trim()) return;
      this.busy = true; this.fromEpMsg = "";
      const r = await callJsonApi("model_config", {
        action: "from_endpoint",
        endpoint_id: this.fromEp.endpoint_id,
        model: this.fromEp.model.trim(),
      });
      if (!r || !r.ok) {
        this.fromEpMsg = (r && r.error) || "Failed to set the default model.";
      } else {
        this.fromEpMsg = "Default model updated.";
        this.fromEp = { endpoint_id: "", model: "" };
        await this.load();
      }
      this.busy = false;
    },
  }));
  })();
</script>
