<link rel="stylesheet" href="/plugins/applicant/webui/applicant-theme.css">
<!-- AZ3 (#840) Tracker — board + attention per campaign. -->
<style>
  .acriteria{max-width:760px;margin:0 auto;padding:8px 4px;color:var(--color-text);font-family:inherit}
  .acriteria h1{font-size:1.5rem;margin:0 0 .25rem}
  .acriteria .sub{color:var(--color-text-secondary,#6b7683);margin:0 0 1rem;font-size:.95rem}
  .acriteria .err{background:var(--color-danger-bg,#fdecea);color:var(--color-danger-text,#9b1c1c);border-radius:8px;padding:8px 12px;font-size:.85rem;margin-top:.75rem}
  .acriteria .empty{text-align:center;padding:30px 10px;color:var(--color-text-secondary,#6b7683)}
  .acriteria .empty h2{font-size:1.2rem;margin:0 0 .3rem;color:var(--color-text)}
  .acriteria .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:1rem;flex-wrap:wrap}
  .acriteria .btn{padding:7px 14px;border-radius:8px;border:1px solid var(--color-border,#d8e0e6);background:var(--color-panel,#f2f5f7);color:var(--color-text);font:inherit;font-weight:600;cursor:pointer;font-size:.82rem}
  .acriteria .btn.primary{background:var(--color-primary,#2d7ff9);color:#fff;border-color:var(--color-primary,#2d7ff9)}
  .acriteria .btn:disabled{opacity:.5;cursor:not-allowed}
  .acriteria .loading{text-align:center;padding:30px;color:var(--color-text-secondary,#6b7683)}
  .acriteria .spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--color-border,#d8e0e6);border-top-color:var(--color-primary,#2d7ff9);border-radius:50%;animation:acriteria-spin .6s linear infinite}
  @keyframes acriteria-spin{to{transform:rotate(360deg)}}
  .acriteria .picker{display:flex;gap:8px;align-items:center;margin-bottom:1rem;flex-wrap:wrap}
  .acriteria .picker select{flex:1;padding:7px 12px;border-radius:8px;border:1px solid var(--color-border,#d8e0e6);background:var(--color-background,#fff);color:var(--color-text);font:inherit;font-size:.85rem;max-width:100%}
  .acriteria .section{margin-bottom:1.5rem}
  .acriteria .section h2{font-size:1.15rem;margin:0 0 .5rem;display:flex;align-items:center;gap:8px}
  .acriteria .section h2 .count{font-size:.8rem;font-weight:400;color:var(--color-text-secondary,#6b7683)}
  .acriteria table{width:100%;border-collapse:collapse;font-size:.85rem;margin-bottom:.75rem}
  .acriteria table th{text-align:left;font-weight:600;padding:6px 8px;border-bottom:2px solid var(--color-border,#d8e0e6);color:var(--color-text-secondary,#6b7683);font-size:.8rem}
  .acriteria table td{padding:6px 8px;border-bottom:1px solid var(--color-border,#d8e0e6)}
  .acriteria .item{background:var(--color-background,#fff);border:1px solid var(--color-border,#d8e0e6);border-radius:10px;padding:10px;overflow:hidden}
  .acriteria .item .title{font-weight:600;font-size:.85rem;margin-bottom:4px;word-break:break-word}
  .acriteria .item .meta{font-size:.75rem;color:var(--color-text-secondary,#6b7683)}
  .acriteria .ghosted{opacity:.5;text-decoration:line-through}
  .acriteria .followup{background:var(--color-warning-bg,#fff3cd);border-left:3px solid var(--color-warning,#ffc107);padding:4px 8px;border-radius:4px;font-size:.8rem;margin-top:4px}
  .acriteria .row-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .acriteria .row-actions select{padding:4px 6px;border-radius:6px;border:1px solid var(--color-border,#d8e0e6);background:var(--color-background,#fff);color:var(--color-text);font:inherit;font-size:.78rem}
  .acriteria .btn.small{padding:4px 9px;font-size:.75rem}
  .acriteria .signal{font-size:.72rem;padding:1px 6px;border-radius:8px;background:var(--color-panel,#e9edf1);margin-right:4px;display:inline-block}
  .acriteria .item-actions{display:flex;gap:6px;margin-top:6px}
</style>

<div class="acriteria" x-data="trackerPanel()">
  <h1>📋 Application Tracker <button class="help-btn" onclick="window.openModal('/plugins/applicant/webui/help.html?surface=tracker')" title="Help for tracker">?</button></h1>
  <div class="sub">Board and attention items per campaign</div>

  <div class="loading" x-show="loading"><div class="spinner"></div><br>Loading…</div>

  <div class="err" x-show="fatalError" x-text="fatalError"></div>

  <div x-show="!loading && !fatalError">
    <div class="picker">
      <select x-model="selectedCampaignId" @change="loadBoard()">
        <option value="">Select a campaign…</option>
        <template x-for="c in campaigns" :key="c.id || c.name">
          <option x-bind:value="c.id || c.name" x-text="c.name || c.id || c"></option>
        </template>
      </select>
      <button class="btn" @click="loadBoard()" :disabled="!selectedCampaignId">↻ Refresh</button>
    </div>

    <div class="empty" x-show="campaigns.length === 0">
      <h2>No campaigns</h2>
      <p>No campaigns available.</p>
    </div>

    <div x-show="selectedCampaignId">
      <div class="section">
        <h2>📊 Board</h2>

        <div class="empty" x-show="boardApplications.length === 0">
          <h2>No applications yet</h2>
          <p>No applications for this campaign.</p>
        </div>

        <table x-show="boardApplications.length > 0">
          <thead>
            <tr>
              <th>Role</th>
              <th>Status</th>
              <th>Updated</th>
              <th>Record outcome</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="app in boardApplications" :key="app.application_id || app.id">
              <tr>
                <td>
                  <strong x-text="app.job_title || app.role_name || '—'"></strong>
                  <span x-show="app.easy_apply" class="signal" title="Easy Apply">⚡ Easy Apply</span>
                  <template x-for="s in (app.signals || [])" :key="s">
                    <span class="signal" x-text="s"></span>
                  </template>
                </td>
                <td x-text="(app.status || '—').replace(/_/g, ' ')"></td>
                <td x-text="app.submitted_at || app.created_at || '—'"></td>
                <td>
                  <div class="row-actions">
                    <select x-model="app._outcomeChoice">
                      <option value="">Choose…</option>
                      <option value="interview_invited">Interview invited</option>
                      <option value="offer">Offer</option>
                      <option value="rejected">Rejected</option>
                      <option value="ghosted">Ghosted</option>
                    </select>
                    <button class="btn small" @click="recordOutcome(app)" :disabled="busyId === (app.application_id || app.id) || !app._outcomeChoice">Record</button>
                    <button class="btn small" @click="archiveApplication(app)" :disabled="busyId === (app.application_id || app.id)">Archive</button>
                  </div>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <div class="section">
        <h2>⚡ Attention</h2>

        <div class="empty" x-show="attentionItems.length === 0">
          <h2>Nothing needs attention</h2>
          <p>No attention items for this campaign.</p>
        </div>

        <div x-show="attentionItems.length > 0">
          <template x-for="item in attentionItems" :key="item.id || item.application_id">
            <div class="item" x-bind:class="{ ghosted: item._kind === 'ghosted' }">
              <div class="title" x-text="item.title || '—'"></div>
              <div class="meta" x-show="item._kind === 'ghosted'" x-text="'Silent ' + (item.payload && item.payload.submission_age_days != null ? item.payload.submission_age_days : '?') + ' days (SLA ' + (item.payload && item.payload.sla_days != null ? item.payload.sla_days : '?') + ')'"></div>
              <div class="followup" x-show="item._kind === 'followup'" x-text="(item.payload && item.payload.body) || 'Follow-up drafted, ready to review.'"></div>
              <div class="item-actions" x-show="item._kind === 'followup'">
                <button class="btn small primary" @click="approveFollowup(item)" :disabled="busyId === item.application_id">Approve &amp; send</button>
              </div>
              <div class="item-actions" x-show="item._kind === 'ghosted'">
                <button class="btn small" @click="archiveApplication({ application_id: item.application_id })" :disabled="busyId === item.application_id">Archive</button>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (() => {
  (() => {
  const _apiP = import("/js/api.js");
  const callJsonApi = async (ep, ...a) => (await _apiP).callJsonApi((ep && String(ep).startsWith("plugins/")) ? ep : ("plugins/applicant/" + ep), ...a);

  window.Alpine.data("trackerPanel", () => ({
    campaigns: [],
    selectedCampaignId: "",
    boardApplications: [],
    attentionItems: [],
    loading: true,
    fatalError: "",
    busyId: "",
    actionError: "",

    async init() {
      this.loading = true;
      this.fatalError = "";
      const r = await callJsonApi("campaigns", { action: "list" });
      if (!r || !r.ok) {
        this.fatalError = (r && r.error) || "Couldn't reach the campaigns engine.";
        this.campaigns = [];
      } else {
        const items = (r.data && r.data.campaigns) || [];
        this.campaigns = items;
        if (items.length > 0) {
          this.selectedCampaignId = items[0].id || items[0].name || "__system__";
        } else {
          this.selectedCampaignId = "__system__";
        }
      }
      this.loading = false;
      if (this.selectedCampaignId) {
        await this.loadBoard();
      }
    },

    async loadBoard() {
      this.loading = true;
      this.fatalError = "";
      const cid = this.selectedCampaignId || "__system__";

      const boardR = await callJsonApi("tracker", { action: "board", campaign_id: cid });
      if (!boardR || !boardR.ok) {
        this.fatalError = (boardR && boardR.error) || "Couldn't reach the tracker engine.";
        this.boardApplications = [];
      } else {
        const d = boardR.data || {};
        this.boardApplications = Array.isArray(d) ? d : (Array.isArray(d.applications) ? d.applications : []);
      }

      if (!this.fatalError) {
        const attnR = await callJsonApi("tracker", { action: "attention", campaign_id: cid });
        if (!attnR || !attnR.ok) {
          this.fatalError = (attnR && attnR.error) || "Couldn't reach the tracker attention engine.";
          this.attentionItems = [];
        } else {
          // The engine returns two separate lists (ghosted / followups_due) rather
          // than one flat "applications" array — tag each row with its source so
          // the template can render/act on them distinctly.
          const d = attnR.data || {};
          const ghosted = Array.isArray(d.ghosted) ? d.ghosted.map((x) => ({ ...x, _kind: "ghosted" })) : [];
          const followups = Array.isArray(d.followups_due) ? d.followups_due.map((x) => ({ ...x, _kind: "followup" })) : [];
          this.attentionItems = [...ghosted, ...followups];
        }
      }

      this.loading = false;
    },

    async recordOutcome(app) {
      const id = app.application_id || app.id;
      const outcomeType = app._outcomeChoice;
      if (!id || !outcomeType) return;
      this.busyId = id;
      this.actionError = "";
      const r = await callJsonApi("tracker", { action: "record_outcome", application_id: id, outcome_type: outcomeType });
      this.busyId = "";
      if (!r || !r.ok) {
        this.actionError = (r && r.error) || "Failed to record outcome.";
        this.fatalError = this.actionError;
        return;
      }
      app._outcomeChoice = "";
      await this.loadBoard();
    },

    async archiveApplication(app) {
      const id = app.application_id || app.id;
      if (!id) return;
      this.busyId = id;
      this.actionError = "";
      const r = await callJsonApi("tracker", { action: "archive", application_id: id });
      this.busyId = "";
      if (!r || !r.ok) {
        this.actionError = (r && r.error) || "Failed to archive application.";
        this.fatalError = this.actionError;
        return;
      }
      await this.loadBoard();
    },

    async approveFollowup(item) {
      const id = item.application_id;
      if (!id) return;
      this.busyId = id;
      this.actionError = "";
      const r = await callJsonApi("tracker", { action: "approve_followup", application_id: id });
      this.busyId = "";
      if (!r || !r.ok) {
        this.actionError = (r && r.error) || "Failed to approve follow-up.";
        this.fatalError = this.actionError;
        return;
      }
      await this.loadBoard();
    }
  }));
  })();
  })();
</script>
