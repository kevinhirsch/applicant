<link rel="stylesheet" href="/plugins/applicant/webui/applicant-theme.css">
<!-- AZ2 Digest — daily review panel for candidate applications. Driven by the engine via the a0-applicant digest proxy (action=get|approve|decline|recap). -->
<style>
  .adigest{max-width:760px;margin:0 auto;padding:8px 4px;color:var(--color-text);font-family:inherit}
  .adigest h1{font-size:1.5rem;margin:0 0 .25rem}
  .adigest .sub{color:var(--color-text-secondary,#6b7683);margin:0 0 1rem;font-size:.95rem}
  .adigest .err{background:var(--color-danger-bg,#fdecea);color:var(--color-danger-text,#9b1c1c);border-radius:8px;padding:8px 12px;font-size:.85rem;margin-top:.75rem}
  .adigest .shortfalls{background:var(--color-warning-bg,#fff8dc);color:var(--color-warning-text,#8a6d0b);border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:.85rem}
  .adigest .shortfalls-title{font-weight:700;margin-bottom:4px}
  .adigest .shortfall-item{padding:2px 0}
  .adigest .empty{text-align:center;padding:30px 10px;color:var(--color-text-secondary,#6b7683)}
  .adigest .empty h2{font-size:1.2rem;margin:0 0 .3rem;color:var(--color-text)}
  .adigest .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:1rem;flex-wrap:wrap}
  .adigest .btn{padding:7px 14px;border-radius:8px;border:1px solid var(--color-border,#d8e0e6);background:var(--color-panel,#f2f5f7);color:var(--color-text);font:inherit;font-weight:600;cursor:pointer;font-size:.82rem}
  .adigest .btn.primary{background:var(--color-primary,#2d7ff9);color:#fff;border-color:var(--color-primary,#2d7ff9)}
  .adigest .btn:disabled{opacity:.5;cursor:not-allowed}
  .adigest .loading{text-align:center;padding:30px;color:var(--color-text-secondary,#6b7683)}
  .adigest .spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--color-border,#d8e0e6);border-top-color:var(--color-primary,#2d7ff9);border-radius:50%;animation:adigest-spin .6s linear infinite}
  @keyframes adigest-spin{to{transform:rotate(360deg)}}
  .adigest .item{background:var(--color-background,#fff);border:1px solid var(--color-border,#d8e0e6);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:12px}
  .adigest .item .info{flex:1;min-width:0}
  .adigest .item .info .title{font-weight:600;font-size:.92rem}
  .adigest .item .info .role{font-size:.82rem;color:var(--color-text-secondary,#6b7683);margin-top:2px}
  .adigest .item .info .score{display:inline-block;font-size:.78rem;padding:2px 7px;border-radius:10px;background:var(--color-panel,#e9edf1);margin-top:4px}
  .adigest .item .info .posted{display:inline-block;font-size:.78rem;color:var(--color-text-secondary,#6b7683);margin-top:4px;margin-left:6px}
  .adigest .item .info .posted.stale{padding:2px 7px;border-radius:10px;background:var(--color-warning-bg,#fef5e6);color:var(--color-warning-text,#8a6d1a);font-weight:600}
  .adigest .item .info .why{font-size:.78rem;color:var(--color-text-secondary,#6b7683);margin-top:4px;line-height:1.3}
  .adigest .item .info .source-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:5px}
  .adigest .item .info .source-link{color:var(--color-primary,#2d7ff9);font-weight:600;font-size:.78rem;text-decoration:none}
  .adigest .item .info .source-link:hover{text-decoration:underline}
  .adigest .item .info .snap-btn{background:none;border:none;color:var(--color-primary,#2d7ff9);font:inherit;font-weight:600;font-size:.78rem;cursor:pointer;padding:0;text-decoration:underline}
  .adigest .item .info .snap-btn:disabled{opacity:.55;cursor:not-allowed}
  .adigest .item .actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;align-items:flex-start}
  .adigest .item .actions .btn{font-size:.75rem;padding:4px 10px}
  .adigest .item .decline-row{display:flex;gap:4px;align-items:center;margin-top:4px}
  .adigest .item .decline-row input{width:100px;padding:3px 6px;border-radius:6px;border:1px solid var(--color-border,#d8e0e6);background:var(--color-background,#fff);color:var(--color-text);font:inherit;font-size:.75rem}
  .adigest .recap-box{background:var(--color-panel,#f2f5f7);border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:.85rem;line-height:1.4;white-space:pre-wrap}
  .adigest .feedback-row{display:flex;gap:4px;align-items:center;margin-top:6px}
  .adigest .feedback-row input{flex:1;min-width:0;padding:3px 6px;border-radius:6px;border:1px solid var(--color-border,#d8e0e6);background:var(--color-background,#fff);color:var(--color-text);font:inherit;font-size:.75rem}
  .adigest .fb-btn{padding:3px 8px;font-size:.85rem;line-height:1}
  .adigest .feedback-err{background:var(--color-danger-bg,#fdecea);color:var(--color-danger-text,#9b1c1c);border-radius:6px;padding:4px 8px;font-size:.72rem;margin-top:4px}
  .adigest .feedback-confirm{background:var(--color-success-bg,#e8f8ef);color:var(--color-success-text,#1a7a3a);border-radius:6px;padding:4px 8px;font-size:.72rem;margin-top:4px}
</style>

<div class="adigest" x-data="digestPanel()">
  <h1>📋 Daily Digest <button class="help-btn" onclick="window.openModal('/plugins/applicant/webui/help.html?surface=digest')" title="Help for digest">?</button></h1>
  <div class="sub" x-show="!loading && !fatalError && rows.length > 0" x-text="`${rows.length} application${rows.length===1?'':'s'} to review`"></div>

  <div class="toolbar">
    <button class="btn primary" @click="refresh()" :disabled="busy">↻ Refresh</button>
    <button class="btn" @click="recap()" :disabled="busy">📊 Weekly recap</button>
    <button class="btn" @click="forceDeliver()" :disabled="busy">🚀 Force deliver</button>
    <button class="btn" @click="previewEmail()" :disabled="busy">✉️ Preview email</button>
  </div>

  <div class="loading" x-show="loading"><div class="spinner"></div><br>Loading digest…</div>

  <div class="err" x-show="fatalError" x-text="fatalError"></div>

  <div class="recap-box" x-show="recapMessage" x-text="recapMessage"></div>

  <div class="shortfalls" x-show="sourceShortfalls.length > 0"><div class="shortfalls-title">⚠️ Source Shortfalls</div><template x-for="s in sourceShortfalls" :key="s.source_key"><div class="shortfall-item" x-text="s.message"></div></template></div>

  <template x-for="row in rows" :key="row.posting_id">
    <div class="item">
      <div class="info">
        <div class="title" x-text="row.title"></div>
        <div class="score" x-show="row.viability_score !== undefined && row.viability_score !== null" x-text="'Score: ' + row.viability_score"></div>
        <div class="posted" :class="{ stale: row.posted_stale }" x-show="row.posted_relative" x-text="(row.posted_label || 'Posted') + ' ' + row.posted_relative"></div>
        <div class="why" x-show="row.why_suggested" x-text="row.why_suggested"></div>
        <!-- RUX-1: the first thing to check is the posting itself. Live link (new tab,
             no opener leak) sourced from row.link (=source_url); a cached snapshot is
             offered as a fallback when the listing is pulled/unreachable. Only render a
             real http(s) URL as a live link — never a javascript:/data: URL. -->
        <div class="source-row">
          <a class="source-link" x-show="isHttp(row.link)" :href="row.link" target="_blank" rel="noopener noreferrer">🔗 View source posting ↗</a>
          <button class="snap-btn" @click="openSnapshot(row)" :disabled="snapshotBusy[row.posting_id]">📸 Cached snapshot</button>
        </div>
        <div class="feedback-err" x-show="snapshotError[row.posting_id]" x-text="snapshotError[row.posting_id]"></div>
        <div class="feedback-row" x-show="!feedbackResult[row.posting_id]">
          <input type="text" class="feedback-input"
                 x-model="(postingFeedback[row.posting_id] = postingFeedback[row.posting_id] || {text:'',sentiment:null}).text"
                 placeholder="What do you think of this one?"
                 :disabled="feedbackBusy[row.posting_id]">
          <button class="btn fb-btn" title="Like"
                  @click="submitPostingFeedback(row.posting_id, 'positive')"
                  :disabled="feedbackBusy[row.posting_id] || !((postingFeedback[row.posting_id]||{}).text||'').trim()">👍</button>
          <button class="btn fb-btn" title="Dislike"
                  @click="submitPostingFeedback(row.posting_id, 'negative')"
                  :disabled="feedbackBusy[row.posting_id] || !((postingFeedback[row.posting_id]||{}).text||'').trim()">👎</button>
        </div>
        <div class="feedback-err" x-show="feedbackError[row.posting_id]" x-text="feedbackError[row.posting_id]"></div>
        <div class="feedback-confirm" x-show="feedbackResult[row.posting_id]">
          ✓ Feedback saved<template x-if="(feedbackResult[row.posting_id]?.likes||[]).length"><span> · likes: <span x-text="feedbackResult[row.posting_id]?.likes.join(', ')"></span></span></template><template x-if="(feedbackResult[row.posting_id]?.dislikes||[]).length"><span> · dislikes: <span x-text="feedbackResult[row.posting_id]?.dislikes.join(', ')"></span></span></template>
        </div>
      </div>
      <div class="actions">
        <button class="btn" @click="approve(row.posting_id)" :disabled="busy">Approve</button>
        <div class="decline-row">
          <input type="text" x-model="declineReasons[row.posting_id]" placeholder="Reason…" @keyup.enter="decline(row.posting_id)">
          <button class="btn" @click="decline(row.posting_id)" :disabled="busy || !(declineReasons[row.posting_id] || '').trim()">Pass</button>
        </div>
        <!-- RUX-2/3/5: open the Review modal (decide / refine / teach-profile). Modal
             panels can't read a path query string, so hand the posting context over on
             a global right before openModal (see review.html header comment). An
             un-drafted row (no application_id yet) is drafted first — see openReview(). -->
        <button class="btn" @click="openReview(row)" :disabled="busy || reviewBusy[row.posting_id]" x-text="reviewBusy[row.posting_id] ? 'Starting…' : 'Review'"></button>
      </div>
      <div class="feedback-err" x-show="reviewError[row.posting_id]" x-text="reviewError[row.posting_id]"></div>
    </div>
  </template>

  <div class="empty" x-show="!loading && !fatalError && rows.length === 0 && !recapMessage">
    <h2>No roles today</h2>
    <p>Check back later for new candidate applications to review.</p>
  </div>
</div>

<script>
  (() => {
  (() => {
  const _apiP = import("/js/api.js");
  const callJsonApi = async (ep, ...a) => (await _apiP).callJsonApi((ep && String(ep).startsWith("plugins/")) ? ep : ("plugins/applicant/" + ep), ...a);

  window.Alpine.data("digestPanel", () => ({
    rows: [],
    sourceShortfalls: [],
    loading: true,
    fatalError: "",
    busy: false,
    recapMessage: "",
    declineReasons: {},
    campaignId: "__system__",
    postingFeedback: {},
    feedbackBusy: {},
    feedbackResult: {},
    feedbackError: {},
    snapshotBusy: {},
    snapshotError: {},
    reviewBusy: {},
    reviewError: {},

    // RUX-1: only ever render a real http(s) URL as a live link (defense in depth —
    // the engine already sanitizes source_url, but never trust it into an href blind).
    isHttp(url) {
      url = (url || "").trim();
      return url.startsWith("http://") || url.startsWith("https://");
    },

    // RUX-2/3/5: open the Review modal (documents.html — the review surface) for this
    // posting. Modal-loaded panels can't read the modal path's query string, so hand
    // the posting context over on a global right before openModal; the query param is
    // kept only for backward-compat / a full-page open.
    //
    // Bug fix (P1, 404 "no such application"): /api/digest rows are pre-application
    // POSTINGS -- ``row.application_id`` is absent on essentially every row (0 of 98
    // in prod). It used to fall back to ``row.posting_id`` as the application id,
    // which the review surface then 404'd on. A posting must be DRAFTED into a real
    // application first -- routed through the existing draft-this path (the "draft"
    // review action, which mirrors the "Approve" button / chat's draft_application
    // tool: tailors materials but stays review-gated, never auto-submits) -- and only
    // the REAL resulting application_id is ever handed to the review surface.
    async openReview(row) {
      const postingId = row.posting_id;
      let applicationId = row.application_id || "";
      if (!applicationId) {
        this.reviewBusy = { ...this.reviewBusy, [postingId]: true };
        this.reviewError[postingId] = "";
        const r = await callJsonApi("review", {
          action: "draft", posting_id: postingId, campaign_id: this.campaignId,
        });
        this.reviewBusy = { ...this.reviewBusy, [postingId]: false };
        applicationId = (r && r.ok && r.data && r.data.application_id) || "";
        if (!applicationId) {
          this.reviewError[postingId] = (r && r.error) || "Couldn't start a draft for this role.";
          return;
        }
        row.application_id = applicationId;  // cache — a second click skips the draft call
      }
      window.__applicantReview = {
        posting_id: postingId,
        application_id: applicationId,
        campaign_id: this.campaignId,
        title: row.title,
        company: row.company,
        source_url: row.link || "",
      };
      window.openModal('/plugins/applicant/webui/documents.html?application_id=' + encodeURIComponent(applicationId));
    },

    // RUX-1: cached-snapshot fallback for a pulled/unreachable listing. Reuses the
    // review proxy's snapshot action and opens the cached HTML in a new tab (same
    // blob pattern as previewEmail below).
    async openSnapshot(row) {
      const id = row.posting_id;
      this.snapshotBusy = { ...this.snapshotBusy, [id]: true };
      this.snapshotError[id] = "";
      const r = await callJsonApi("review", { action: "snapshot", posting_id: id });
      this.snapshotBusy = { ...this.snapshotBusy, [id]: false };
      if (r && r.ok && r.data && r.data.html) {
        const blob = new Blob([r.data.html], { type: "text/html" });
        window.open(URL.createObjectURL(blob), "_blank", "noopener");
      } else {
        this.snapshotError[id] = (r && r.error) || "No cached snapshot is available for this role.";
      }
    },

    async init() {
      await this.load();
      // FR-NOTIF-2: signal web-portal presence so the notifier can hold the
      // Discord ready-ping while the user is actively looking at the digest
      // here (mirrors the legacy frontend/static/applicant/js/digest.js).
      this.setPresence(true);
      document.addEventListener('visibilitychange', () => {
        this.setPresence(document.visibilityState === 'visible');
      });
      window.addEventListener('focus', () => this.setPresence(true));
      window.addEventListener('blur', () => this.setPresence(false));
    },

    async setPresence(present) {
      try {
        await callJsonApi("digest", { action: "presence", present: present });
      } catch (e) {
        /* presence is best-effort */
      }
    },

    async load() {
      this.loading = true;
      this.fatalError = "";
      this.recapMessage = "";
      const r = await callJsonApi("digest", { action: "get" });
      if (!r || !r.ok) {
        this.fatalError = (r && r.error) || "Couldn't reach the digest engine.";
        this.rows = [];
      } else {
        this.rows = (r.data && r.data.rows) || [];
        this.campaignId = (r.data && r.data.campaign_id) || "__system__";
        this.sourceShortfalls = (r.data && r.data.source_shortfalls) || [];
        if (r.data && r.data.empty_day_note) {
          this.rows = [];
        }
      }
      this.loading = false;
    },

    async refresh() {
      await this.load();
    },

    async approve(applicationId) {
      this.busy = true;
      this.fatalError = "";
      const r = await callJsonApi("digest", { action: "approve", application_id: applicationId });
      this.busy = false;
      if (!r || !r.ok) {
        this.fatalError = (r && r.error) || "Couldn't approve that role.";
        return;
      }
      await this.load();
    },

    async decline(applicationId) {
      const reason = (this.declineReasons[applicationId] || "").trim();
      if (!reason) return;
      this.busy = true;
      this.fatalError = "";
      const r = await callJsonApi("digest", { action: "decline", application_id: applicationId, reason: reason });
      this.busy = false;
      if (!r || !r.ok) {
        this.fatalError = (r && r.error) || "Couldn't decline that role.";
        return;
      }
      this.declineReasons[applicationId] = "";
      await this.load();
    },

    async submitPostingFeedback(postingId, sentiment) {
      const draft = this.postingFeedback[postingId] || {};
      const text = (draft.text || "").trim();
      if (!text) return;
      this.feedbackBusy = { ...this.feedbackBusy, [postingId]: true };
      this.feedbackError[postingId] = "";
      const r = await callJsonApi("feedback", {
        action: "posting", campaign_id: this.campaignId,
        posting_id: postingId, sentiment: sentiment, text: text,
      });
      this.feedbackBusy = { ...this.feedbackBusy, [postingId]: false };
      if (!r || !r.ok) {
        this.feedbackError[postingId] = (r && r.error) || "Feedback failed to save.";
        this.feedbackResult[postingId] = null;
      } else {
        this.feedbackResult[postingId] = r.data || {};
        this.postingFeedback[postingId] = { text: "", sentiment: null };
      }
    },

    async recap() {
      this.busy = true;
      this.fatalError = "";
      this.recapMessage = "";
      const r = await callJsonApi("digest", { action: "recap" });
      if (r && r.ok && r.data) {
        // render_weekly_recap_message() returns {subject, body, ...} — "body" is
        // the actual first-person recap sentence (was reading nonexistent
        // "recap"/"message" keys, so this box silently stayed empty).
        this.recapMessage = r.data.body || r.data.recap || r.data.message || JSON.stringify(r.data);
      } else {
        this.fatalError = (r && r.error) || "Weekly recap failed.";
      }
      this.busy = false;
    },

    async forceDeliver() {
      this.busy = true;
      this.fatalError = "";
      this.recapMessage = "";
      const r = await callJsonApi("digest", { action: "deliver" });
      this.busy = false;
      if (r && r.ok && r.data) {
        const d = r.data;
        const channels = (d.delivered_channels || []).join(', ') || 'no channels';
        const count = d.row_count || 0;
        this.recapMessage = `Delivered ${count} role${count === 1 ? '' : 's'} via ${channels}. Subject: "${d.email_subject || ''}"`;
      } else {
        this.fatalError = (r && r.error) || "Force deliver failed.";
      }
    },

    async previewEmail() {
      this.busy = true;
      this.fatalError = "";
      const r = await callJsonApi("digest", { action: "email" });
      this.busy = false;
      if (r && r.ok && r.data && r.data.html) {
        const blob = new Blob([r.data.html], { type: "text/html" });
        const url = URL.createObjectURL(blob);
        window.open(url, "_blank");
      } else {
        this.fatalError = (r && r.error) || "Couldn't build the email preview.";
      }
    }
  }));
  })();
  })();
</script>
