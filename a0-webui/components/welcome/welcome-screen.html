<html>

<head>
    <script type="module">
        import { store } from "/components/welcome/welcome-store.js";
    </script>
    <!-- APP-LP-1: theme tokens (colors/spacing/typography scale) shared with every
         other Applicant panel — reused here for the landing-page gadgets so the
         whole app speaks one visual language, light + dark. -->
    <link rel="stylesheet" href="/plugins/applicant/webui/applicant-theme.css">
</head>

<body>
    <div x-data>
        <template x-if="$store.welcomeStore">
            <div x-init="$store.welcomeStore.init(); if ($store.welcomeStore.isVisible) { $store.welcomeStore.onCreate(); } $watch('$store.welcomeStore.isVisible', (visible) => { if (visible) { $store.welcomeStore.onCreate(); window.dispatchEvent(new CustomEvent('applicant:refresh-today')); } });"
                 class="welcome-container">
                <x-extension id="welcome-screen-start"></x-extension>

                <main class="welcome-shell">
                    <section class="welcome-composer" aria-label="Start a new chat">
                        <x-component path="chat/attachments/inputPreview.html"></x-component>
                        <x-component path="chat/input/chat-bar-input.html"></x-component>
                    </section>

                    <section class="welcome-alerts"
                             x-show="$store.welcomeStore.sortedBanners.length > 0 || $store.welcomeStore.hasDismissedBanners">
                        <div class="welcome-banners" x-show="$store.welcomeStore.sortedBanners.length > 0">
                            <x-extension id="welcome-banners-start"></x-extension>
                            <template x-for="banner in $store.welcomeStore.sortedBanners" :key="banner.id">
                                <article class="welcome-banner" :class="$store.welcomeStore.getBannerClass(banner.type)">
                                    <div class="welcome-banner-icon">
                                        <span class="material-symbols-outlined" x-text="$store.welcomeStore.getBannerIcon(banner.type)"></span>
                                    </div>
                                    <div class="welcome-banner-content">
                                        <div class="welcome-banner-title" x-text="banner.title"></div>
                                        <div class="welcome-banner-html"
                                             x-html="banner.html"
                                             @click="$store.welcomeStore.handleBannerHtmlClick($event)"></div>
                                    </div>
                                    <button class="welcome-banner-cta"
                                            type="button"
                                            x-show="banner.cta_text && banner.cta_action"
                                            @click.stop="$store.welcomeStore.executeBannerAction(banner.cta_action)"
                                            :aria-label="banner.cta_text">
                                        <span x-text="banner.cta_text"></span>
                                        <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
                                    </button>
                                    <button class="welcome-banner-dismiss"
                                            type="button"
                                            x-show="banner.dismissible !== false"
                                            @click.stop="$store.welcomeStore.dismissBanner(banner.id)"
                                            title="Dismiss"
                                            aria-label="Dismiss">
                                        <span class="material-symbols-outlined">close</span>
                                    </button>
                                </article>
                            </template>
                            <x-extension id="welcome-banners-end"></x-extension>
                        </div>

                        <button type="button"
                                class="welcome-undismiss-button"
                                x-show="$store.welcomeStore.hasDismissedBanners"
                                :disabled="$store.welcomeStore.bannersLoading"
                                @click="$store.welcomeStore.undismissBanners()">
                            <span class="material-symbols-outlined">undo</span>
                            <span>Show dismissed notices</span>
                        </button>
                    </section>

                    <!-- APP-LP-1: slim utility header — active campaign + the
                         notifications-connect affordance (kept per the story; the
                         upstream AI-accounts/Connect-Channels marketing cards below
                         are cut by simply never rendering welcome-actions-end here). -->
                    <header class="lp-topbar" x-data="lpHeader()" x-init="init()">
                        <div class="lp-topbar-info">
                            <span class="lp-topbar-eyebrow">Command center</span>
                            <h1 class="lp-topbar-campaign" x-text="campaignName"></h1>
                        </div>
                        <button type="button"
                                class="lp-notif-pill"
                                :class="{ 'is-connected': connected }"
                                @click="openChannels()"
                                :aria-label="connected ? 'Notification channels connected — manage' : 'Connect notifications so alerts reach you'"
                                :title="connected ? 'Notification channels connected — manage' : 'Connect notifications so alerts reach you'">
                            <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
                            <span x-text="connected ? 'Notifications on' : 'Connect notifications'"></span>
                        </button>
                    </header>

                    <!-- ① Pending Reviews — the hero of the page. -->
                    <section class="lp-gadget lp-pending-reviews" aria-label="Pending Reviews"
                              x-data="lpPendingReviews()" x-init="init(); window.addEventListener('applicant:refresh-today', () => load())">
                        <header class="welcome-panel-header">
                            <h2>Pending Reviews
                                <span class="lp-count-badge" x-show="!loading && !fatalError && count > 0" x-text="count"></span>
                            </h2>
                            <div class="welcome-panel-actions">
                                <button class="welcome-panel-icon-button"
                                        type="button"
                                        @click="load()"
                                        :disabled="loading"
                                        title="Refresh"
                                        aria-label="Refresh Pending Reviews">
                                    <span class="material-symbols-outlined">refresh</span>
                                </button>
                            </div>
                        </header>

                        <div class="lp-skeleton" x-show="loading">
                            <div class="lp-skeleton-row"></div>
                            <div class="lp-skeleton-row"></div>
                            <div class="lp-skeleton-row"></div>
                        </div>

                        <div class="lp-error" x-show="!loading && fatalError" x-text="fatalError"></div>

                        <div class="lp-empty" x-show="!loading && !fatalError && groups.length === 0">
                            <span class="material-symbols-outlined" aria-hidden="true">task_alt</span>
                            <p>You're all caught up — nothing waiting on review.</p>
                        </div>

                        <ul class="lp-review-list" x-show="!loading && !fatalError && groups.length > 0">
                            <template x-for="g in groups" :key="g.applicationId">
                                <li class="lp-review-row">
                                    <div class="lp-review-info">
                                        <div class="lp-review-title-row">
                                            <span class="lp-score" :class="scoreClass(g.score)" x-show="g.score !== null" x-text="g.score"></span>
                                            <div class="lp-review-role" :title="g.roleLabel" x-text="g.roleLabel"></div>
                                        </div>
                                        <div class="lp-review-chips">
                                            <template x-for="item in g.items" :key="item.id">
                                                <span class="badge" x-text="item.kindLabel"></span>
                                            </template>
                                        </div>
                                    </div>
                                    <div class="lp-review-actions">
                                        <button class="btn" type="button" @click="review(g)">Review</button>
                                        <button class="btn primary" type="button" @click="approve(g)" :disabled="g.busy">Approve</button>
                                        <button class="btn" type="button" @click="snooze(g)" :disabled="g.busy">Snooze</button>
                                    </div>
                                </li>
                            </template>
                        </ul>

                        <a class="lp-view-all" href="javascript:void(0)" x-show="!loading && overflowCount > 0" @click="viewAll()">
                            View all <span x-text="count"></span> in Today →
                        </a>
                    </section>

                    <!-- ② Top New Matches. -->
                    <section class="lp-gadget lp-top-matches" aria-label="Top New Matches" x-data="lpTopMatches()" x-init="init()">
                        <header class="welcome-panel-header">
                            <h2>Top New Matches</h2>
                            <div class="welcome-panel-actions">
                                <button class="welcome-panel-icon-button"
                                        type="button"
                                        @click="load()"
                                        :disabled="loading"
                                        title="Refresh"
                                        aria-label="Refresh Top New Matches">
                                    <span class="material-symbols-outlined">refresh</span>
                                </button>
                            </div>
                        </header>

                        <div class="lp-skeleton" x-show="loading">
                            <div class="lp-skeleton-row"></div>
                            <div class="lp-skeleton-row"></div>
                        </div>

                        <div class="lp-error" x-show="!loading && fatalError" x-text="fatalError"></div>

                        <div class="lp-empty" x-show="!loading && !fatalError && rows.length === 0">
                            <span class="material-symbols-outlined" aria-hidden="true">search</span>
                            <p x-text="emptyNote || 'No new matches right now — check back after the next discovery run.'"></p>
                        </div>

                        <ul class="lp-match-list" x-show="!loading && !fatalError && rows.length > 0">
                            <template x-for="row in rows" :key="row.posting_id">
                                <li class="lp-match-row">
                                    <div class="lp-match-info">
                                        <div class="lp-match-title-row">
                                            <span class="lp-score" :class="scoreClass(row.viability_score)" x-text="Math.round(row.viability_score || 0)"></span>
                                            <span class="lp-match-title" x-text="row.title + (row.company ? ' · ' + row.company : '')"></span>
                                        </div>
                                        <div class="lp-match-why" x-show="row.why_suggested" x-text="row.why_suggested"></div>
                                        <div class="lp-error" x-show="rowError[row.posting_id]" x-text="rowError[row.posting_id]"></div>
                                    </div>
                                    <div class="lp-match-actions">
                                        <div class="lp-row-buttons">
                                            <button class="btn" type="button" @click="skip(row)" :disabled="busy[row.posting_id]">Skip</button>
                                            <button class="btn primary" type="button" @click="draftThis(row)" :disabled="busy[row.posting_id]">Draft this</button>
                                        </div>
                                    </div>
                                </li>
                            </template>
                        </ul>
                    </section>

                    <!-- ③ Pipeline Funnel + ④ Daily Progress share one cheap read
                         (campaigns.pipeline_summary) but render as two distinct cards. -->
                    <template x-if="true">
                        <div x-data="lpPipelineProgress()" x-init="init()" style="display: contents;">
                            <section class="lp-gadget lp-pipeline-funnel" aria-label="Pipeline Funnel">
                                <header class="welcome-panel-header">
                                    <h2>Pipeline Funnel</h2>
                                    <div class="welcome-panel-actions">
                                        <button class="welcome-panel-icon-button"
                                                type="button"
                                                @click="load()"
                                                :disabled="loading"
                                                title="Refresh"
                                                aria-label="Refresh Pipeline Funnel">
                                            <span class="material-symbols-outlined">refresh</span>
                                        </button>
                                    </div>
                                </header>

                                <div class="lp-skeleton" x-show="loading">
                                    <div class="lp-skeleton-row"></div>
                                </div>

                                <div class="lp-error" x-show="!loading && fatalError" x-text="fatalError"></div>

                                <div class="lp-funnel" x-show="!loading && !fatalError">
                                    <template x-for="stage in stages" :key="stage.key">
                                        <div class="lp-funnel-stage">
                                            <div class="lp-funnel-value" x-text="stage.value"></div>
                                            <div class="lp-funnel-label" x-text="stage.label"></div>
                                        </div>
                                    </template>
                                </div>
                            </section>

                            <!-- ④ Daily Progress. -->
                            <section class="lp-gadget lp-daily-progress" aria-label="Daily Progress">
                                <header class="welcome-panel-header">
                                    <h2>Daily Progress</h2>
                                </header>

                                <div class="lp-skeleton" x-show="loading">
                                    <div class="lp-skeleton-row"></div>
                                </div>

                                <div class="lp-error" x-show="!loading && fatalError" x-text="fatalError"></div>

                                <template x-if="!loading && !fatalError">
                                    <div>
                                        <div class="lp-progress-grid">
                                            <div class="lp-progress-stat">
                                                <div class="lp-progress-value" x-text="drafted"></div>
                                                <div class="lp-progress-label">Drafted today</div>
                                            </div>
                                            <div class="lp-progress-stat">
                                                <div class="lp-progress-value" x-text="submitted"></div>
                                                <div class="lp-progress-label">Submitted today</div>
                                            </div>
                                            <div class="lp-progress-stat">
                                                <div class="lp-progress-value">
                                                    <span x-text="streak"></span>
                                                    <span class="material-symbols-outlined" style="font-size: 1.1rem; vertical-align: -0.1rem;" x-show="streak > 0" aria-hidden="true">local_fire_department</span>
                                                </div>
                                                <div class="lp-progress-label">Day streak</div>
                                            </div>
                                        </div>

                                        <div class="lp-progress-target" x-show="target > 0">
                                            <div class="lp-target-row">
                                                <span>Today's target</span>
                                                <span x-text="appsToday + ' of ' + target"></span>
                                            </div>
                                            <div class="lp-target-track">
                                                <span class="lp-target-fill" :style="`width: ${attainmentPct}%`"></span>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </section>
                        </div>
                    </template>

                    <article class="welcome-system-card"
                             x-show="$store.welcomeStore.systemResourceBanner"
                             x-transition.opacity>
                        <header class="welcome-panel-header">
                            <h2 x-text="$store.welcomeStore.systemResourceBanner?.title || 'System Resources'"></h2>
                            <div class="welcome-panel-actions">
                                <button class="welcome-panel-icon-button"
                                        type="button"
                                        :disabled="$store.welcomeStore.bannersLoading"
                                        @click.stop="$store.welcomeStore.refreshBanners(true)"
                                        title="Refresh"
                                        aria-label="Refresh System Resources">
                                    <span class="material-symbols-outlined">refresh</span>
                                </button>
                                <button class="welcome-panel-icon-button"
                                        type="button"
                                        x-show="$store.welcomeStore.systemResourceBanner?.dismissible !== false"
                                        @click.stop="$store.welcomeStore.dismissBanner($store.welcomeStore.systemResourceBanner?.id || 'system-resources')"
                                        title="Dismiss"
                                        aria-label="Dismiss System Resources">
                                    <span class="material-symbols-outlined">close</span>
                                </button>
                            </div>
                        </header>
                        <div class="welcome-system-body"
                             x-html="$store.welcomeStore.systemResourceBanner?.html || ''"></div>
                    </article>
                </main>

                <x-extension id="welcome-screen-end"></x-extension>
            </div>
        </template>
    </div>

    <style>
        .welcome-today { width: 100%; }
        .welcome-container {
            position: relative;
            min-height: 100vh;
            overflow: hidden;
            padding: clamp(4.8rem, 8vh, 6.4rem) clamp(1.25rem, 5.4vw, 6.5rem) 3.5rem;
            background: var(--color-background);
            color: var(--color-text);
            font-family: var(--font-family-main, "Rubik", Arial, Helvetica, sans-serif);
        }

        .welcome-container > x-extension,
        .welcome-actions > x-extension,
        .welcome-banners > x-extension,
        .welcome-lower-grid > x-extension,
        .welcome-lower-grid > x-extension > x-component,
        .welcome-lower-grid > x-extension > x-component > div[x-data] {
            display: contents;
        }

        .welcome-container::before {
            content: "";
            position: absolute;
            inset: -6% -8% -10% 10%;
            background-image: url("./public/darkSymbol.svg");
            background-repeat: no-repeat;
            background-position: center top;
            background-size: min(78vw, 980px) auto;
            opacity: 0.105;
            pointer-events: none;
        }

        .light-mode .welcome-container::before {
            filter: invert(0.55);
            opacity: 0.055;
        }

        .welcome-shell {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 1.55rem;
            width: min(100%, 840px);
            margin: 0 auto;
            padding-top: 4rem;
        }

        .welcome-composer {
            width: 100%;
        }

        .welcome-composer > x-component,
        .welcome-composer > x-component > div[x-data],
        .welcome-composer > x-component > div[x-data] > template + div {
            display: contents;
        }

        .welcome-composer .input-row {
            min-height: 4.9rem;
            padding: 0.58rem 0.7rem 0.58rem 0.86rem;
            border-radius: 8px;
            background: color-mix(in srgb, var(--color-panel) 64%, var(--color-background) 36%);
        }

        .welcome-composer #chat-input {
            min-height: 3.2rem;
            font-size: 1.03rem;
        }

        .welcome-composer #expand-button {
            display: none;
        }

        .welcome-composer .chat-more-panel {
            top: calc(100% + 0.55rem);
            bottom: auto;
            margin-top: 0;
            margin-bottom: 0;
        }

        .welcome-alerts {
            display: grid;
            gap: 0.7rem;
        }

        .welcome-banners {
            display: grid;
            gap: 0.75rem;
        }

        .welcome-banner,
        .welcome-panel-card,
        .welcome-system-card,
        .lp-gadget {
            border: 1px solid color-mix(in srgb, var(--color-border) 66%, transparent);
            background: color-mix(in srgb, var(--color-panel) 78%, var(--color-background) 22%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.026);
            backdrop-filter: blur(18px);
        }

        .welcome-banner {
            --welcome-banner-accent: #2f6bff;
            position: relative;
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto auto;
            align-items: start;
            gap: 1rem;
            min-height: 5.45rem;
            padding: 1rem 1.1rem;
            border-radius: 8px;
            text-align: left;
        }

        .welcome-banner.banner-info {
            --welcome-banner-accent: #2f6bff;
        }

        .welcome-banner.banner-warning {
            --welcome-banner-accent: #f59e0b;
        }

        .welcome-banner.banner-error {
            --welcome-banner-accent: #ef4444;
        }

        .welcome-banner-icon {
            display: inline-flex;
            width: 2.25rem;
            height: 2.25rem;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            color: var(--welcome-banner-accent);
            background: color-mix(in srgb, var(--welcome-banner-accent) 9%, transparent);
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--welcome-banner-accent) 12%, transparent);
        }

        .welcome-banner-icon .material-symbols-outlined {
            font-size: 1.28rem;
        }

        .welcome-banner-content {
            flex: 1;
            min-width: 0;
            padding-top: 0.05rem;
        }

        .welcome-banner-title {
            margin-bottom: 0.28rem;
            color: var(--color-text);
            font-size: 1rem;
            font-weight: 560;
            line-height: 1.25;
        }

        .welcome-banner-html {
            max-width: 72ch;
            color: color-mix(in srgb, var(--color-text) 72%, transparent);
            font-size: 0.92rem;
            line-height: 1.45;
        }

        .welcome-banner-html a {
            color: #5f83ff;
            text-decoration: none;
        }

        .welcome-banner-html a:hover {
            text-decoration: underline;
        }

        .welcome-banner-cta,
        .welcome-banner-html .btn,
        .welcome-banner-html button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 2.35rem;
            border: 0;
            border-radius: 8px;
            padding: 0.55rem 0.9rem;
            background-color: #4248f1;
            color: #fff;
            font-family: var(--font-family-main, "Rubik", Arial, Helvetica, sans-serif);
            font-size: 0.88rem;
            font-weight: 460;
            line-height: 1.2;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: background-color 0.18s ease;
        }

        .welcome-banner-cta {
            align-self: center;
            justify-self: end;
            gap: 0.36rem;
            white-space: nowrap;
        }

        .welcome-banner-cta .material-symbols-outlined {
            font-size: 1.05rem;
        }

        .welcome-banner-cta:hover,
        .welcome-banner-cta:focus-visible,
        .welcome-banner-html .btn:hover,
        .welcome-banner-html .btn:focus-visible,
        .welcome-banner-html button:hover,
        .welcome-banner-html button:focus-visible {
            background-color: #353bc5;
            outline: none;
        }

        .welcome-banner-dismiss,
        .welcome-undismiss-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            border: 0;
            background: transparent;
            color: color-mix(in srgb, var(--color-text) 74%, transparent);
            cursor: pointer;
            font-family: var(--font-family-main, "Rubik", Arial, Helvetica, sans-serif);
        }

        .welcome-banner-dismiss {
            width: 2rem;
            height: 2rem;
            border-radius: 8px;
            margin: -0.2rem -0.2rem 0 0;
        }

        .welcome-banner-dismiss:hover,
        .welcome-undismiss-button:hover {
            color: var(--color-text);
            background: color-mix(in srgb, var(--color-border) 45%, transparent);
        }

        .welcome-undismiss-button {
            justify-self: start;
            border-radius: 9px;
            padding: 0.45rem 0.55rem;
            font-size: 0.82rem;
        }

        .welcome-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .welcome-panel-header h2 {
            margin: 0;
            color: var(--color-text);
            font-size: 1.05rem;
            font-weight: 520;
            line-height: 1.2;
        }

        .welcome-panel-actions {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            flex: 0 0 auto;
        }

        .welcome-panel-icon-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: color-mix(in srgb, var(--color-text) 74%, transparent);
            cursor: pointer;
            font-family: var(--font-family-main, "Rubik", Arial, Helvetica, sans-serif);
        }

        .welcome-panel-icon-button:hover,
        .welcome-panel-icon-button:focus-visible {
            color: var(--color-text);
            background: color-mix(in srgb, var(--color-border) 45%, transparent);
            outline: none;
        }

        .welcome-panel-icon-button:disabled {
            cursor: default;
            opacity: 0.45;
        }

        .welcome-panel-icon-button .material-symbols-outlined {
            font-size: 1.18rem;
        }

        .welcome-system-card {
            min-width: 0;
            border-radius: 8px;
            padding: 1.6rem 1.7rem;
            text-align: left;
        }

        .system-resource-body {
            display: grid;
            gap: 1.22rem;
        }

        .system-resource-meter {
            display: grid;
            grid-template-columns: 8.2rem minmax(0, 1fr);
            gap: 1rem;
            align-items: center;
        }

        .system-resource-label {
            display: grid;
            gap: 0.38rem;
            min-width: 0;
        }

        .system-resource-name,
        .system-resource-detail-title {
            color: color-mix(in srgb, var(--color-text) 74%, transparent);
            font-size: 0.82rem;
            font-weight: 430;
            letter-spacing: 0.02em;
        }

        .system-resource-value,
        .system-resource-detail-value {
            color: color-mix(in srgb, var(--color-text) 76%, transparent);
            font-size: 0.96rem;
            font-variant-numeric: tabular-nums;
            line-height: 1.2;
            white-space: nowrap;
        }

        .system-resource-track {
            height: 0.64rem;
            overflow: hidden;
            border-radius: 999px;
            background: color-mix(in srgb, var(--color-border) 70%, transparent);
        }

        .system-resource-fill {
            display: block;

    </style>

    <script>
    (() => {
        const _apiP = import("/js/api.js");
        const callJsonApi = async (ep, ...a) => (await _apiP).callJsonApi(
            (ep && String(ep).startsWith("plugins/")) ? ep : ("plugins/applicant/" + ep), ...a
        );

        // Shared between lpPendingReviews and lpTopMatches (same module scope,
        // no store plumbing needed): postings already in the review queue —
        // i.e. already drafted — so Top New Matches can exclude them instead
        // of showing "draft this" for a role that's already drafted. Both
        // gadgets still fetch their OWN primary data independently (one
        // gadget failing/slow never blocks the other); this is a best-effort
        // cross-filter only, populated whenever Pending Reviews loads.
        const reviewedPostingIds = new Set();

        // ── Header: active campaign name + notifications-connect affordance ──
        window.Alpine.data("lpHeader", () => ({
            campaignName: "Command center",
            connected: false,

            async init() {
                this.loadCampaign();
                this.loadChannels();
            },

            async loadCampaign() {
                try {
                    const r = await callJsonApi("campaigns", { action: "list" });
                    const list = (r && r.ok && r.data && r.data.campaigns) || [];
                    const active = list.find((c) => c.active) || list[0];
                    if (active && active.name) this.campaignName = active.name;
                } catch (e) {
                    // keep default label — never block the header on this
                }
            },

            async loadChannels() {
                try {
                    const r = await callJsonApi("channels", { action: "get" });
                    const d = (r && r.ok && r.data) || {};
                    // GET /api/setup/channels deliberately never echoes back a saved
                    // webhook/URL (it would leak a live secret to the client) — it
                    // reports configured-or-not booleans instead.
                    this.connected = !!(
                        d.channels_configured ||
                        d.discord_configured ||
                        d.email_configured ||
                        d.ntfy_configured
                    );
                } catch (e) {
                    this.connected = false;
                }
            },

            openChannels() {
                window.openModal("/plugins/applicant/webui/channels.html");
            },
        }));

        // ── ① Pending Reviews ──
        const KIND_AFFORDANCE = {
            digest_approval: "digest.html",
            material_review: "documents.html",
            final_approval: "documents.html",
            missing_attr: "attributes.html",
            integral_change: "compare.html",
        };

        window.Alpine.data("lpPendingReviews", () => ({
            loading: true,
            fatalError: "",
            count: 0,
            groups: [],
            overflowCount: 0,
            GROUP_CAP: 5,

            async init() {
                await this.load();
            },

            async load() {
                this.loading = true;
                this.fatalError = "";
                const r = await callJsonApi("pending", { action: "list", campaign_id: "__system__" });
                if (!r || !r.ok) {
                    this.fatalError = "Couldn't reach the review queue — check back in a moment.";
                    this.groups = [];
                    this.count = 0;
                    this.loading = false;
                    return;
                }
                const items = (r.data && r.data.items) || [];
                this.count = (r.data && r.data.count) ?? items.length;

                const byApp = new Map();
                for (const item of items) {
                    const key = item.application_id || item.id;
                    if (!byApp.has(key)) {
                        const brief = item.application_brief || {};
                        let roleLabel = item.title;
                        if (brief.job_title && brief.company) roleLabel = `${brief.job_title} · ${brief.company}`;
                        else if (brief.job_title) roleLabel = brief.job_title;
                        byApp.set(key, {
                            applicationId: item.application_id,
                            roleLabel: roleLabel || "Untitled role",
                            // Same posting.viability_score the Digest/Top New
                            // Matches surface reads — one score, one source.
                            score: typeof brief.viability_score === "number" ? brief.viability_score : null,
                            items: [],
                            busy: false,
                        });
                        // Already drafted (has material_review items) -> Top
                        // New Matches should not also offer to "draft this".
                        if (brief.posting_id) reviewedPostingIds.add(brief.posting_id);
                    }
                    byApp.get(key).items.push({
                        id: item.id,
                        kind: item.kind,
                        kindLabel: this.materialLabel(item),
                    });
                }

                // Best-fit-first: highest-scored roles reviewed first (same
                // ordering intent as the digest's rank-stacking sort). Roles
                // without a score (older demo data / not yet scored) sink to
                // the bottom rather than being dropped.
                const groups = Array.from(byApp.values()).sort(
                    (a, b) => (b.score ?? -1) - (a.score ?? -1)
                );
                this.overflowCount = Math.max(0, groups.length - this.GROUP_CAP);
                this.groups = groups.slice(0, this.GROUP_CAP);
                this.loading = false;
            },

            scoreClass(score) {
                if (score === null || score === undefined) return "";
                if (score >= 75) return "lp-score-good";
                if (score >= 55) return "lp-score-ok";
                return "";
            },

            materialLabel(item) {
                const cleaned = String(item.title || "").replace(/\s*ready for review\.?$/i, "").trim();
                return cleaned || item.kind;
            },

            review(g) {
                const first = g.items[0] || {};
                const panel = KIND_AFFORDANCE[first.kind] || "documents.html";
                const qs = g.applicationId ? `?application_id=${encodeURIComponent(g.applicationId)}` : "";
                window.openModal(`/plugins/applicant/webui/${panel}${qs}`);
            },

            async approve(g) {
                g.busy = true;
                await callJsonApi("pending", {
                    action: "resolve_bulk",
                    campaign_id: "__system__",
                    action_ids: g.items.map((i) => i.id),
                });
                g.busy = false;
                await this.load();
            },

            async snooze(g) {
                g.busy = true;
                for (const item of g.items) {
                    await callJsonApi("pending", { action: "snooze", action_id: item.id, hours: 24 });
                }
                g.busy = false;
                await this.load();
            },

            viewAll() {
                window.openModal("/plugins/applicant/webui/today.html");
            },
        }));

        // ── ② Top New Matches ──
        window.Alpine.data("lpTopMatches", () => ({
            loading: true,
            fatalError: "",
            rows: [],
            emptyNote: "",
            busy: {},
            rowError: {},
            dismissed: new Set(),
            CAP: 5,

            async init() {
                await this.load();
            },

            async load(_isRetry = false) {
                this.loading = true;
                this.fatalError = "";
                const r = await callJsonApi("digest", { action: "get" });
                if (!r || !r.ok) {
                    // The digest read is the slowest gadget call on this page (a
                    // per-posting warnings pass the engine deliberately never
                    // caches — see DigestCache's docstring). One transparent
                    // retry absorbs an occasional slow/timed-out first attempt
                    // (cold cache, a network blip) before showing an error —
                    // still bounded, still never hangs the page.
                    if (!_isRetry) {
                        return this.load(true);
                    }
                    this.fatalError = "Matches are taking longer than usual to load — check back in a moment.";
                    this.rows = [];
                    this.loading = false;
                    return;
                }
                const allRows = (r.data && r.data.rows) || [];
                this.emptyNote = (r.data && r.data.note) || "";
                // Viable postings without a draft yet: one digest read, minus
                // whatever Pending Reviews has already reported as drafted
                // (reviewedPostingIds — see its declaration above) — two
                // filtered views over the same underlying scored data, not a
                // second scoring pipeline.
                this.rows = allRows
                    .filter((row) => !this.dismissed.has(row.posting_id))
                    .filter((row) => !reviewedPostingIds.has(row.posting_id))
                    .slice(0, this.CAP);
                this.loading = false;
            },

            scoreClass(score) {
                const n = Number(score) || 0;
                if (n >= 75) return "lp-score-good";
                if (n >= 55) return "lp-score-ok";
                return "";
            },

            async draftThis(row) {
                this.busy = { ...this.busy, [row.posting_id]: true };
                this.rowError = { ...this.rowError, [row.posting_id]: "" };
                const r = await callJsonApi("digest", { action: "approve", application_id: row.posting_id });
                this.busy = { ...this.busy, [row.posting_id]: false };
                if (!r || !r.ok) {
                    this.rowError = { ...this.rowError, [row.posting_id]: (r && r.error) || "Couldn't draft this one — try again." };
                    return;
                }
                this.dismissed.add(row.posting_id);
                this.rows = this.rows.filter((r2) => r2.posting_id !== row.posting_id);
            },

            async skip(row) {
                this.busy = { ...this.busy, [row.posting_id]: true };
                this.rowError = { ...this.rowError, [row.posting_id]: "" };
                const r = await callJsonApi("digest", {
                    action: "decline",
                    application_id: row.posting_id,
                    reason: "Skipped from the landing page",
                });
                this.busy = { ...this.busy, [row.posting_id]: false };
                if (!r || !r.ok) {
                    this.rowError = { ...this.rowError, [row.posting_id]: (r && r.error) || "Couldn't skip this one — try again." };
                    return;
                }
                this.dismissed.add(row.posting_id);
                this.rows = this.rows.filter((r2) => r2.posting_id !== row.posting_id);
            },
        }));

        // ── ③ Pipeline Funnel + ④ Daily Progress (one shared cheap read) ──
        window.Alpine.data("lpPipelineProgress", () => ({
            loading: true,
            fatalError: "",
            stages: [],
            drafted: 0,
            submitted: 0,
            streak: 0,
            target: 0,
            appsToday: 0,

            async init() {
                await this.load();
            },

            async load() {
                this.loading = true;
                this.fatalError = "";
                const r = await callJsonApi("campaigns", { action: "pipeline_summary" });
                if (!r || !r.ok) {
                    this.fatalError = "Couldn't reach the pipeline engine — check back in a moment.";
                    this.stages = [];
                    this.loading = false;
                    return;
                }
                const data = r.data || {};
                const f = data.funnel || {};
                this.stages = [
                    { key: "discovered", label: "Discovered", value: f.discovered || 0 },
                    { key: "scored", label: "Scored", value: f.scored || 0 },
                    { key: "drafted", label: "Drafted", value: f.drafted || 0 },
                    { key: "submitted", label: "Submitted", value: f.submitted || 0 },
                    { key: "interview", label: "Interview", value: f.interview || 0 },
                ];
                this.drafted = (data.today && data.today.drafted) || 0;
                this.submitted = (data.today && data.today.submitted) || 0;
                this.streak = data.streak_days || 0;
                this.loading = false;

                // Best-effort: today's applications-vs-target needs the resolved
                // campaign id (pipeline_summary just resolved one server-side).
                // Never blocks the two cards above, which already rendered.
                if (data.campaign_id) {
                    try {
                        const g = await callJsonApi("campaigns", {
                            action: "guardrails",
                            campaign_id: data.campaign_id,
                        });
                        if (g && g.ok && g.data && g.data.today) {
                            this.appsToday = g.data.today.applications_today || 0;
                            this.target = g.data.today.daily_target || 0;
                        }
                    } catch (e) {
                        // target stays 0 -> the target row just hides itself
                    }
                }
            },

            get attainmentPct() {
                if (!this.target) return 0;
                return Math.max(0, Math.min(100, Math.round((this.appsToday / this.target) * 100)));
            },
        }));
    })();
    </script>
