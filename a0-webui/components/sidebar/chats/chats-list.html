<html>

<head>
  <script type="module">
    import { store } from "/components/sidebar/chats/chats-store.js";
  </script>
</head>

<body>
  <div x-data x-init="$store.chats.init()">
    <template x-if="$store.chats">
      <div class="chats-list-container" x-data>
        <x-extension id="sidebar-chats-list-start"></x-extension>
        <div class="section-header-row">
          <h3 class="section-header">Campaign Conversation</h3>
          <x-extension id="chats-header-controls"></x-extension>
        </div>
        <x-extension id="sidebar-chats-list-end"></x-extension>
      </div>
    </template>
  </div>

  <style>
    .chats-list-container .section-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      flex-shrink: 0;
      margin-bottom: var(--spacing-xs);
      z-index: 10;
    }

    .chats-list-container .section-header {
      margin: 0;
    }

    /* Chats list container and items */
    .chats-list-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      margin-top: var(--spacing-md);
    }

    .chats-config-list {
      flex: 1;
      min-height: 0;
      overflow: scroll;
      scroll-behavior: smooth;
      max-height: 100%;
    }

    /* Unified item-row style — shared with the Applicant nav rows and the
       Tasks list rows (see left-sidebar.html and tasks-list.html). */
    .chat-container {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 7px 16px;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      color: var(--color-text);
      opacity: .85;
      transition: background-color .15s ease, opacity .15s ease;
    }

    .chats-config-list .chat-tree-item {
      display: block;
      align-items: stretch;
      justify-content: flex-start;
    }

    .chat-child-list {
      list-style: none;
      padding: 0;
      margin: 0;
      width: 100%;
    }

    .chats-config-list .chat-child-list > li {
      display: block;
      padding: 0;
    }

    .chat-child-container {
      min-height: 34px;
    }

    .chat-child-indent {
      width: 18px;
      flex-shrink: 0;
    }

    .chat-expand-btn {
      position: absolute;
      left: 2px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 0;
      background: transparent;
      color: var(--color-text-muted);
      opacity: 0;
      pointer-events: none;
      padding: 0;
      margin: 0;
      z-index: 1;
    }

    .chat-expand-btn.is-visible {
      opacity: 0.95;
      pointer-events: auto;
    }

    .chat-expand-btn.is-visible:hover {
      color: var(--color-text);
      opacity: 1;
    }

    .chat-expand-btn .material-symbols-outlined {
      font-size: 18px;
    }

    .chat-container.chat-has-children .chat-list-button {
      padding-left: 24px;
    }

    .chat-list-button {
      display: flex;
      align-items: center;
      flex-grow: 1;
      min-width: 0;
      overflow: hidden;
      gap: 0.5em;
    }

    .project-color-ball {
      width: 0.6em;
      height: 0.6em;
      border-radius: 50%;
      display: inline-block;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    .chat-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 13px;
      font-weight: 400;
    }

    .chat-list-action-btn {
      flex-shrink: 0;
    }

    .chat-container:hover{
      background-color: var(--color-background-hover);
      opacity: 1;
    }

    .device-pointer .chat-container .chat-list-action-btn {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0s;
    }

    .device-pointer .chat-container:hover .chat-list-action-btn {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .device-touch .chats-list-container .chat-list-action-btn {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .empty-list-message {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100px;
      color: var(--color-secondary);
      text-align: center;
      opacity: 0.7;
      font-style: italic;
    }

    .light-mode .empty-list-message {
      color: var(--color-secondary-light);
    }

    /* Selected chat accent */
    .chat-selected {
      opacity: 1;
    }
    .chat-selected .chat-name {
      font-weight: 700;
    }

    /* .chat-list-button.font-bold { position: relative; background-color: var(--color-border) 0.05; } */
    /* .chat-list-button.font-bold::before { content: ""; position: absolute; left: 0; top: 0; height: 100%; width: 3px; background-color: var(--color-border); border-top-left-radius: 3px; border-bottom-left-radius: 3px; } */
    /* .light-mode .chat-list-button.font-bold { background-color: var(--color-border) 0.05; } */
    /* .light-mode .chat-list-button.font-bold::before { background-color: var(--color-border); } */
  </style>
</body>

</html>
